# Contract: docs/apko-contract.md. Checkout intentionally reads the caller.
name: Validate Apko base images (no AWS)

on:
  workflow_call:
    inputs:
      frameworks:
        description: "JSON array de frameworks a validar."
        type: string
        required: true

      melange-config:
        description: "Package filename under melange/; kept compatible with existing callers."
        type: string
        default: bundle-pem-test.yaml
      locked-build:
        description: "Use caller composition v2 (verified anchors, package lock, fixed date, metadata)."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Digests verificados em 08/09/2026; atualizações de ferramentas exigem revisão.
  APKO_IMAGE: cgr.dev/chainguard/apko@sha256:7fcdcd1ca1fb1e4601fac698458d1b0d6cde7d9e7f0e3cca733aee894889f2e6
  MELANGE_IMAGE: cgr.dev/chainguard/melange@sha256:15dd85c0e35c099e4142c463d8479da769f319f01ab0f9e6ff427f79d63091f9
  # HGC-01: registry identity verified on 2026-10-05; no mutable default.
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  melange-bundle:
    name: Compile certs with melange
    runs-on: ubuntu-latest
    # Observado: 21-37s num run real (M14). Timeout generoso pra não
    # confundir variância normal de rede/runner com um hang de verdade.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow inputs before privileged operations
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/pipeline/catalog/validate_inputs.py ]]; then
            python3 -B -m scripts.pipeline.catalog.validate_inputs
          else
            python3 -B .github/scripts/validate_inputs.py
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
          image: ${{ env.BINFMT_IMAGE }}

      - name: Record structured binfmt evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def docker(*arguments):
              return subprocess.run(['docker', *arguments], check=True, text=True, capture_output=True)

          requested = os.environ['BINFMT_IMAGE']
          pin = re.fullmatch(r'docker\.io/tonistiigi/binfmt(?::(?P<tag>[A-Za-z0-9_.-]+))?'
                             r'@(?P<digest>sha256:[0-9a-f]{64})', requested)
          require(pin is not None and pin['tag'] != 'latest', 'binfmt must have an explicit immutable digest')
          inspected = json.loads(docker('image', 'inspect', requested).stdout)
          require(isinstance(inspected, list) and len(inspected) == 1, 'expected one inspected binfmt image')
          image = inspected[0]
          digests = set()
          for reference in image.get('RepoDigests') or []:
              repository, separator, digest = reference.partition('@')
              if repository in ('docker.io/tonistiigi/binfmt', 'tonistiigi/binfmt') and separator:
                  digests.add(digest)
          require(digests == {pin['digest']}, 'resolved binfmt digest differs from the requested digest')
          host = image.get('Os', '') + '/' + image.get('Architecture', '')
          require(host == 'linux/amd64', 'the hosted binfmt producer must run on linux/amd64')
          version = docker('run', '--rm', requested, '--version')
          versions = set(re.findall(r'\bqemu/v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\b',
                                    version.stdout + version.stderr))
          require(len(versions) == 1, 'binfmt did not report one QEMU version')
          status = json.loads(docker('run', '--rm', '--privileged', requested).stdout)
          require('linux/arm64' in status.get('supported', [])
                  and 'qemu-aarch64' in status.get('emulators', []), 'required arm64 emulation is unavailable')
          caller_repository = os.environ['GITHUB_REPOSITORY']
          repository = caller_repository.lower()
          require(re.fullmatch(r'[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*', repository), 'invalid producer repository')
          workflow_ref = os.environ['GITHUB_WORKFLOW_REF']
          require(workflow_ref.startswith(caller_repository + '/.github/workflows/'), 'unexpected workflow repository')
          workflow, separator, workflow_revision = workflow_ref[len(caller_repository) + 1:].partition('@')
          require(separator and workflow_revision and re.fullmatch(r'\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml', workflow),
                  'unexpected workflow identity')
          run, attempt = int(os.environ['GITHUB_RUN_ID']), int(os.environ['GITHUB_RUN_ATTEMPT'])
          require(run > 0 and attempt > 0, 'invalid producer run or attempt')
          require(re.fullmatch(r'[0-9a-f]{40}', os.environ['GITHUB_SHA']), 'invalid producer source SHA')
          require(re.fullmatch(r'refs/(?:heads|tags)/[^\s]+|refs/pull/[0-9]+/(?:head|merge)', os.environ['GITHUB_REF'])
                  and '..' not in os.environ['GITHUB_REF'], 'invalid producer ref')
          producer = dict(repository=repository, ref=os.environ['GITHUB_REF'], source_sha=os.environ['GITHUB_SHA'],
                          run_id=run, run_attempt=attempt, release_id=f'r{run}-a{attempt}', workflow=workflow)
          document = dict(schema_version=1, kind='binfmt-evidence', producer=producer, requested_ref=requested,
                          requested_digest=pin['digest'], resolved_digest=next(iter(digests)), qemu_version=versions.pop(),
                          architecture_contract=dict(host_platform=host, emulated_platforms=['linux/arm64'],
                                                     registered_emulators=['qemu-aarch64'],
                                                     build_architectures=['aarch64', 'x86_64']))
          Path('melange/binfmt-evidence.json').write_bytes(
              json.dumps(document, sort_keys=True, separators=(',', ':'), allow_nan=False).encode())
          PY

      - name: Validate package configuration and trust inputs
        env:
          MELANGE_CONFIG: ${{ inputs.melange-config }}
          LOCKED_BUILD: ${{ inputs.locked-build }}
        run: |
          set -euo pipefail
          [[ "$MELANGE_CONFIG" =~ ^[a-z0-9-]+\.yaml$ ]]
          test -f "melange/$MELANGE_CONFIG"
          if [[ "$LOCKED_BUILD" == true ]]; then
            python3 -B scripts/certificates/prepare_anchors.py verify
          fi
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Record melange version
        run: docker run --rm "$MELANGE_IMAGE" version > melange/melange-version.txt

      - name: Generate ephemeral melange signing key
        working-directory: melange
        run: |
          docker run --rm -v "$PWD":/work -w /work "$MELANGE_IMAGE" \
            keygen melange.rsa

      - name: Build CA package (amd64 + arm64)
        env:
          MELANGE_CONFIG: ${{ inputs.melange-config }}
        working-directory: melange
        run: |
          set -eu
          # Cada processo usa uma arquitetura para evitar corrida no workspace
          # compartilhado (test-dirfs-0 ausente observado no runner real).
          for ARCH in x86_64 aarch64; do
            docker run --privileged --rm -v "$PWD":/work -w /work "$MELANGE_IMAGE" \
              build "$MELANGE_CONFIG" --arch "$ARCH" --signing-key melange.rsa --build-date "$BUILD_DATE"
          done

      - name: Upload melange repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: melange-repo
          overwrite: true
          path: |
            melange/packages/
            melange/melange.rsa.pub
            melange/melange-version.txt
            melange/binfmt-evidence.json
          retention-days: 30

  validate:
    name: Validate ${{ matrix.framework }}
    needs: melange-bundle
    runs-on: ubuntu-latest
    # Observado: 21-64s por framework num run real com 16 frameworks (M14).
    # dotnet8/java21 (SDK/JDK completos) foram os mais lentos observados;
    # margem cobre frameworks futuros maiores e variância de download.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(inputs.frameworks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow inputs before building
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
        run: python3 -B .github/scripts/validate_inputs.py

      - name: Install pinned apko
        run: |
          set -eu
          docker create --name apko-extract "$APKO_IMAGE"
          docker cp apko-extract:/usr/bin/apko ./apko
          docker rm apko-extract
          chmod +x ./apko
          ./apko version

      - name: Download melange repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: melange-repo
          path: melange-repo

      - name: Set local image name
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: echo "IMAGE_NAME=localhost/image-base-${FRAMEWORK}" >> "$GITHUB_ENV"

      - name: Build multi-architecture OCI artifact once
        env:
          FRAMEWORK: ${{ matrix.framework }}
          LOCKED_BUILD: ${{ inputs.locked-build }}
        run: |
          set -eu
          if [ "$LOCKED_BUILD" = true ]; then
            python3 -B -m scripts.pipeline.artifacts.build_image "$FRAMEWORK" "${FRAMEWORK}.oci"
          else
          mkdir -p "${FRAMEWORK}.oci/sbom"
          ./apko build --arch x86_64,aarch64 --sbom-path "${FRAMEWORK}.oci/sbom" \
            --repository-append melange-repo/packages \
            --keyring-append melange-repo/melange.rsa.pub \
            "frameworks/${FRAMEWORK}.yaml" "$IMAGE_NAME" "${FRAMEWORK}.oci"
          fi
          python3 -B .github/scripts/oci_artifact.py prepare "${FRAMEWORK}.oci"
          # Keep the original receipt with each candidate; HGC-04 will persist it durably.
          cp melange-repo/binfmt-evidence.json "${FRAMEWORK}.oci/binfmt-evidence.json"

      - name: Preserve SBOMs and replay inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.framework }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.framework }}.oci/sbom/
            ${{ matrix.framework }}.oci/apko.lock.json
            ${{ matrix.framework }}.oci/build-inputs.json
            ${{ matrix.framework }}.oci/validated-index.json
            ${{ matrix.framework }}.oci/binfmt-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Install Trivy
        uses: alric-corp/alric-containers-reusable-workflows/actions/setup-trivy@b87bda30545041ddb5d35c345ffc155bbc611dc8 # governed Trivy setup

      - name: Record validation tool versions
        run: python3 -B .github/scripts/tool_versions.py validation reports/tool-versions.json

      - name: Scan both architectures
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: python3 -B .github/scripts/scan_images.py oci "${FRAMEWORK}.oci"

      # M11: o gate acima usa --ignore-unfixed de propósito (bloquear por
      # algo que ninguém pode corrigir ainda não ajuda) — mas isso deixa
      # CVEs sem correção completamente invisíveis. Este passo é só
      # visibilidade: nunca falha o job, roda mesmo se o scan acima já
      # bloqueou, e nunca esconde a causa real de um bloqueio.
      - name: Report CVEs without an available fix (informational)
        if: always()
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: python3 -B .github/scripts/report_unfixed_cves.py oci "${FRAMEWORK}.oci"

      - name: Preserve scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-scans-${{ matrix.framework }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve validated OCI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Mesmo nome no run: retries do publicador reutilizam a validação
          # aprovada. Novo conteúdo só substitui o anterior depois do scan.
          name: validated-oci-${{ matrix.framework }}
          overwrite: true
          path: ${{ matrix.framework }}.oci/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
